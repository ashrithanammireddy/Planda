<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/planda-icon.png" />
    <link rel="apple-touch-icon" href="/planda-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Planda: an AI-powered study planner with time-blocking, assessments, and auto-generated study schedules." />
    <title>Planda: Study Planner</title>

    <!-- Social / message link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Planda: Study Planner" />
    <meta property="og:description" content="An AI-powered study planner that keeps you organized, focused, and stress-free." />
    <meta property="og:image" content="/planda-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Planda: Study Planner" />
    <meta name="twitter:description" content="An AI-powered study planner that keeps you organized, focused, and stress-free." />
    <meta name="twitter:image" content="/planda-icon.png" />
    <script>
      // Paint the saved theme color immediately to avoid a flash of the default.
      try {
        var s = JSON.parse(localStorage.getItem('planda.state.v1') || '{}')
        var bg = s.settings && s.settings.backgroundColor
        var ap = (s.settings && s.settings.appearance) || 'Auto'
        var lum = function (hex) {
          hex = (hex || '').replace('#', '')
          if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c }).join('')
          var n = parseInt(hex, 16)
          if (isNaN(n)) return 1
          return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255
        }
        var dark = ap === 'Dark' || (ap === 'Auto' && lum(bg) < 0.5)
        var page = dark ? '#14161c' : bg || '#e8eaee'
        document.documentElement.style.setProperty('--planda-bg', page)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
